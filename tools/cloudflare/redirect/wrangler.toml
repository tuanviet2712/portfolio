# Worker chuyển hướng về https://letuanviet.com
# Triển khai:  npx -y wrangler@4 deploy   (chạy trong thư mục này)
#
# ĐÃ THAY BẰNG REDIRECT RULES (2026-11-09): xem redirect-rules.json cùng thư mục. Luật chạy trước Worker
# và không tính vào hạn yêu cầu của Workers miễn phí. Hai luật chạy từ 09/11/2026 (đã kiểm: Worker không nhận
# yêu cầu nào khi thử), sau đó 3 route bên dưới đã được GỠ; script Worker vẫn còn trên Cloudflare nhưng không gắn route.
# Muốn quay lại: tắt hai luật (Rules > Overview của từng tên miền), rồi chạy lệnh triển khai ở trên để gắn lại 3 route.
#
# Không gắn vào letuanviet.digital/google49ce971bbd8cd1d5.html: đường dẫn đó do Worker
# letuanviet-google-verification trả lời (route cụ thể hơn nên được ưu tiên), để Google Search Console
# vẫn xác minh được tên miền cũ khi làm thủ tục "Thay đổi địa chỉ".
name = "letuanviet-www-redirect"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "letuanviet.digital/*", zone_name = "letuanviet.digital" },
  { pattern = "www.letuanviet.digital/*", zone_name = "letuanviet.digital" },
  { pattern = "www.letuanviet.com/*", zone_name = "letuanviet.com" },
]
