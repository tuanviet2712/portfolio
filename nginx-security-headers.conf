# Header bảo mật dùng chung cho nginx-portfolio.conf
# Sao file này vào /etc/nginx/snippets/portfolio-security.conf
# Vì sao tách riêng: nginx KHÔNG kế thừa add_header từ cấp server xuống khối location nào tự có add_header,
# nên mọi khối đó phải include lại file này, nếu không ảnh/CSS/JS sẽ mất CSP và nosniff.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
