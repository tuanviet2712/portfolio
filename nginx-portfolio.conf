# ===================================================================
#  NGINX — Portfolio Lê Tuấn Việt
#  Cấu hình mẫu cho VPS: bảo mật, gzip, cache, HTTPS-ready.
#
#  CÁCH DÙNG:
#    1. Sao file này vào /etc/nginx/sites-available/portfolio
#    2. Sửa server_name thành tên miền thật (ví dụ: letuanviet.com)
#    3. Sửa root thành đường dẫn thư mục Portfolio trên VPS
#    4. ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#    5. sudo nginx -t && sudo systemctl reload nginx
#    6. Cài HTTPS: sudo certbot --nginx -d letuanviet.com -d www.letuanviet.com
# ===================================================================

server {
    listen 80;
    listen [::]:80;

    # ─── TÊN MIỀN (sửa thành domain thật) ───
    server_name letuanviet.com www.letuanviet.com;

    # ─── THƯ MỤC GỐC (sửa thành đường dẫn thật trên VPS) ───
    root /var/www/portfolio;
    index index.html;

    # ─── CHUYỂN HƯỚNG www → non-www (tuỳ chọn) ───
    # if ($host = www.letuanviet.com) {
    #     return 301 https://letuanviet.com$request_uri;
    # }

    # =================================================================
    #  BẢO MẬT — SECURITY HEADERS
    # =================================================================

    # Chống clickjacking: không cho nhúng trang vào iframe của site khác
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Chống MIME sniffing: trình duyệt phải dùng đúng Content-Type server trả
    add_header X-Content-Type-Options "nosniff" always;

    # Chống XSS reflection (trình duyệt cũ)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy: chỉ gửi origin (không gửi full URL) khi sang site khác
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy: tắt camera, micro, geolocation (trang portfolio không cần)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy
    #   script-src  'self'                         → chỉ chạy JS từ cùng domain
    #   style-src   'self' 'unsafe-inline' fonts…  → CSS cục bộ + inline style (JS đặt) + Google Fonts
    #   font-src    'self' fonts.gstatic.com       → font cục bộ + Google Fonts
    #   img-src     'self' data:                   → ảnh cục bộ + base64 (hero 3D bundle)
    #   media-src   'self'                         → video cục bộ (portrait.mp4)
    #   connect-src 'self'                         → fetch chỉ tới file cục bộ (khung hero)
    #   object-src  'none'                         → chặn Flash / plugin
    #   frame-ancestors 'self'                     → chống clickjacking (thay X-Frame-Options ở CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;

    # =================================================================
    #  HTTPS — BẬT SAU KHI CÀI CERTBOT (bỏ comment các dòng dưới)
    # =================================================================
    # Sau khi chạy: sudo certbot --nginx -d letuanviet.com
    # Certbot sẽ tự thêm khối listen 443 ssl và chuyển hướng 80 → 443.
    # Khi đó bỏ comment dòng HSTS dưới đây:
    #
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # =================================================================
    #  CHẶN TRUY CẬP THƯ MỤC / FILE NHẠY CẢM
    # =================================================================

    # Chặn tools/ (script build, AI model, ảnh gốc, video nguồn)
    location /tools/ {
        deny all;
        return 404;
    }

    # Chặn node_modules/ (nếu vô tình upload)
    location /node_modules/ {
        deny all;
        return 404;
    }

    # Chặn file ẩn (.git, .env, .gitignore…)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Chặn truy cập trực tiếp các file cấu hình
    location ~* (package\.json|package-lock\.json|nginx.*\.conf)$ {
        deny all;
        return 404;
    }

    # Chặn file .md (README, NGHIEN-CUU-KY-THUAT…) — tài liệu nội bộ
    location ~* \.md$ {
        deny all;
        return 404;
    }

    # Chặn file .bat (script Windows)
    location ~* \.bat$ {
        deny all;
        return 404;
    }

    # =================================================================
    #  NÉN GZIP — giảm 60-80% dung lượng truyền tải
    # =================================================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        image/x-icon
        application/pdf;

    # =================================================================
    #  CACHE TỐI ƯU — tải lại nhanh cho người dùng quay lại
    # =================================================================

    # Ảnh, video, font, PDF: cache 1 năm (nội dung hiếm khi đổi)
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|mp4|webm|woff|woff2|ttf|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS, JS: cache 1 tháng (có thể sửa khi cập nhật nội dung)
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML: không cache mạnh (luôn kiểm tra bản mới)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "no-cache";
    }

    # =================================================================
    #  ROUTING — SPA fallback
    # =================================================================

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tắt log cho favicon
    location = /favicon.ico { access_log off; log_not_found off; }
}

